<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · MovieTrendz</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@72..144,400..900&family=Outfit:wght@300..600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --color-canvas:#f5f7fb; --color-surface:#fff; --color-surface-2:#f8fafc; --color-fg:#172033; --color-muted:#64748b; --color-faint:#94a3b8; --color-line:#e2e8f0; --color-signal:#4f46e5; --color-signal-ink:#fff; --color-sage:#16a34a; --color-coral:#dc2626; color-scheme:light; }
    html.dark { --color-canvas:#0f172a; --color-surface:#111c32; --color-surface-2:#17243b; --color-fg:#e5e7eb; --color-muted:#a8b3c7; --color-faint:#71809a; --color-line:#263653; --color-signal:#818cf8; --color-signal-ink:#111827; color-scheme:dark; }
    * { box-sizing: border-box; }
    html,body { margin:0; min-height:100%; background:var(--color-canvas); color:var(--color-fg); }
    body { font-family:"Outfit",ui-sans-serif,system-ui,sans-serif; display:flex; align-items:center; justify-content:center; padding:1.5rem; }
    .auth-shell { width:min(100%,27rem); }
    .brand { display:flex; align-items:center; justify-content:center; gap:.65rem; margin-bottom:1.25rem; color:var(--color-fg); font-size:1.05rem; font-weight:700; letter-spacing:-.02em; }
    .brand-mark { display:grid; place-items:center; width:2.25rem; height:2.25rem; border-radius:.7rem; background:var(--color-signal); color:#fff; font-size:1.1rem; }
    .card { background:var(--color-surface); border:1px solid var(--color-line); border-radius:.875rem; padding:2rem; width:100%; box-shadow:0 12px 35px rgba(15,23,42,.08); }
    h1 { font-family:"Outfit",ui-sans-serif,system-ui,sans-serif; font-size:1.5rem; letter-spacing:-.035em; margin:0 0 .45rem; text-align:left; }
    .intro { margin:0 0 1.5rem; color:var(--color-muted); font-size:.9rem; line-height:1.5; }
    .theme-toggle { position:fixed; top:1rem; right:1rem; height:2.5rem; padding:0 .8rem; border:1px solid var(--color-line); border-radius:.55rem; background:var(--color-surface); color:var(--color-muted); font:inherit; cursor:pointer; }
    .theme-toggle:hover { color:var(--color-fg); border-color:var(--color-signal); }
    .field-label { font-size:.8rem; color:var(--color-muted); margin-bottom:.3rem; display:block; }
    .field {
      width:100%; min-height:2.8rem; border-radius:.5rem; border:1px solid var(--color-line); background:var(--color-surface);
      color:var(--color-fg); font-size:.9rem; padding:.7rem .85rem; outline:none; font-family:inherit; margin-bottom:1rem;
    }
    .field::placeholder { color:var(--color-faint); }
    .field:focus { border-color:var(--color-signal); box-shadow:0 0 0 3px color-mix(in srgb,var(--color-signal) 15%,transparent); }
    .btn {
      width:100%; margin-top:.25rem; height:2.8rem; border-radius:.5rem; border:1px solid var(--color-signal);
      background:var(--color-signal); color:#fff; font-size:.9rem; font-weight:600;
      transition:filter .15s;
    }
    .btn:hover { filter:brightness(1.1); }
    .row { display:flex; justify-content:center; gap:.5rem; margin-top:1.25rem; font-size:.875rem; color:var(--color-muted); }
    .row a { color:var(--color-signal); }
    .error { color:var(--color-coral); font-size:.8rem; margin-top:.75rem; }
    ::selection { background:var(--color-signal); color:var(--color-signal-ink); }
    @media (max-width:480px) { body{padding:1rem}.card{padding:1.4rem}.theme-toggle{top:.65rem;right:.65rem} }
  </style>
</head>
<body>
  <button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch color theme">☾ <span>Dark mode</span></button>
  <div class="auth-shell">
   <div class="brand"><span class="brand-mark" aria-hidden="true">M</span><span>MovieTrendz</span></div>
   <div class="card">
    <h1 id="title">Sign in with email</h1>
    <p class="intro">Enter your email and password to continue.</p>
    <form id="form">
      <input type="hidden" name="action" value="login" />
      <div id="nameWrap" style="display:none">
        <label class="field-label">Name</label>
        <input class="field" name="name" placeholder="Jane Doe" />
      </div>
      <label class="field-label">Email</label>
      <input class="field" name="email" type="email" placeholder="you@example.com" required />
      <label class="field-label">Password</label>
      <input class="field" name="password" type="password" placeholder="••••••••" required />
      <button type="submit" class="btn">Sign in</button>
      <p id="err" class="error"></p>
    </form>
    <div class="row">
      <span>No account?</span>
      <a href="#" id="toggle">Register</a>
    </div>
   </div>
  </div>

  <script>
    const form = document.getElementById("form");
    const title = document.getElementById("title");
    const nameWrap = document.getElementById("nameWrap");
    const action = form.querySelector('[name=action]');
    const toggle = document.getElementById("toggle");
    const err = document.getElementById("err");
    const themeToggle = document.getElementById("themeToggle");
    if (localStorage.getItem("movietrendz-theme") === "dark") document.documentElement.classList.add("dark");
    function syncThemeToggle() {
      const dark = document.documentElement.classList.contains("dark");
      themeToggle.innerHTML = `${dark ? "☀" : "☾"} <span>${dark ? "Light mode" : "Dark mode"}</span>`;
    }
    themeToggle.addEventListener("click", () => {
      document.documentElement.classList.toggle("dark");
      localStorage.setItem("movietrendz-theme", document.documentElement.classList.contains("dark") ? "dark" : "light");
      syncThemeToggle();
    });
    syncThemeToggle();
    let mode = "login";

    function setMode(m) {
      mode = m; action.value = m;
      title.textContent = m === "login" ? "Sign in with email" : "Create account";
      nameWrap.style.display = m === "register" ? "" : "none";
      toggle.textContent = m === "login" ? "Register" : "Sign in";
      document.querySelector('button[type=submit]').textContent = m === "login" ? "Sign in" : "Create account";
      err.textContent = "";
    }
    toggle.addEventListener("click", (e) => { e.preventDefault(); setMode(mode === "login" ? "register" : "login"); });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      err.textContent = "";
      const data = new FormData(form);
      const body = { email: data.get("email"), password: data.get("password") };
      if (mode === "register") body.name = data.get("name");
      const res = await fetch(`/api/auth/${mode === "register" ? "register" : "login"}`, {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
      });
      const j = await res.json();
      if (!res.ok) { err.textContent = j.error || "failed"; return; }
      location.href = "/";
    });
    setMode("login");
  </script>
</body>
</html>
