<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YouTube Video Scheduler</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #e2e8f0; }
    header { padding: 1.25rem 2rem; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center; }
    header h1 { margin: 0; font-size: 1.3rem; }
    main { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }
    .card { background: #1e293b; border: 1px solid #33475b; border-radius: 12px; padding: 1.25rem; margin-bottom: 1.5rem; }
    .card h2 { margin-top: 0; font-size: 1.05rem; }
    label { display: block; font-size: .8rem; color: #94a3b8; margin-bottom: .25rem; }
    input, select, textarea { width: 100%; padding: .6rem; border: 1px solid #33475b; border-radius: 8px; background: #0f172a; color: #e2e8f0; }
    input[type="file"] { padding: 0; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .pill { display: inline-block; padding: .15rem .6rem; border-radius: 999px; font-size: .75rem; }
    .s-pending { background: #33455b; color: #93c5fd; }
    .s-processing, .s-uploading { background: #78350f; color: #fbbf24; }
    .s-done { background: #14532d; color: #4ade80; }
    .s-failed, .s-exhausted { background: #450a0a; color: #f87171; }
    .muted { color: #64748b; font-size: .8rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: .5rem .6rem; border-bottom: 1px solid #1e293b; font-size: .85rem; }
    th { color: #94a3b8; font-weight: 600; }
    button { background: #2563eb; color: #fff; border: none; border-radius: 8px; padding: .55rem 1rem; cursor: pointer; }
    button.ghost { background: transparent; border-color: #33475b; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } .row { grid-template-columns: 1fr; } }
    .hidden { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>🎬 YouTube Video Scheduler</h1>
    <a href="/api/auth/connect" class="ghost" style="color:#93c5fd">Connect Channel</a>
  </header>
  <main>
    <section class="card">
      <h2>Schedule an upload</h2>
      <form id="scheduleForm">
        <div class="row">
          <div><label>Video file</label><input type="file" name="video" accept="video/*" required /></div>
          <div><label>Title</label><input type="text" name="title" placeholder="My video title" required /></div>
        </div>
        <label>Description</label>
        <textarea name="description" rows="3" placeholder="Describe your video…"></textarea>
        <div class="row">
          <div><label>Hashtags (space or comma separated)</label><input type="text" name="hashtags" placeholder="#funny #vlog" /></div>
          <div><label>Tags (comma separated)</label><input type="text" name="tags" placeholder="comedy, vlog" /></div>
        </div>
        <div class="row">
          <div><label>Privacy</label><select name="privacy"><option value="private">Private</option><option value="unlisted">Unlisted</option><option value="public">Public</option></select></div>
          <div><label>Schedule at</label><input type="datetime-local" name="scheduleAt" /></div>
        </div>
        <label>Channel (leave blank to auto-pick across your connected channels)</label>
        <select name="channelId"><option value="">Auto-select (spreads load across channels)</option></select>
        <button type="submit" id="submitBtn">Schedule upload</button>
        <p id="msg" class="muted"></p>
      </form>
    </section>

    <section class="card">
      <h2>Channels</h2>
      <div id="channels"><p class="muted">Loading…</p></div>
    </section>

    <section class="card">
      <h2>Scheduled jobs</h2>
      <div id="jobs"><p class="muted">Loading…</p></div>
    </section>
  </main>

  <script>
    const API = "/api";
    const $ = (id) => document.getElementById(id);

    // Load channels into the dropdown + a channel list.
    async function loadChannels() {
      const res = await fetch(`${API}/auth/channels`);
      const list = await res.json();
      const sel = $("channelId");
      list.forEach(c => {
        const opt = document.createElement("option");
        opt.value = c.id;
        opt.textContent = `${c.name} (${c.active ? "active" : "inactive"}) — ${c.quota_used}/${0} quota`;
        sel.appendChild(opt);
      });
      const box = $("channels");
      if (!list.length) { box.innerHTML = '<p class="muted">No channels connected. Click "Connect Channel" in the header.</p>'; return; }
      box.innerHTML = `<table><tr><th>Channel</th><th>Status</th><th>Quota used</th></tr>` +
        list.map(c => `<tr><td>${c.name}</td><td>${c.active?'active':'inactive'}</td><td>${c.quota_used}</td></tr>`).join("") + `</table>`;
    }

    async function loadJobs() {
      const res = await fetch(`${API}/videos`);
      const list = await res.json();
      const box = $("jobs");
      if (!list.length) { box.innerHTML = '<p class="muted">No jobs.</p>'; return; }
      const rows = list.map(j => {
        const ts = j.scheduled_at ? new Date(j.scheduled_at*1000).toLocaleString() : "—";
        const due = j.scheduled_at && j.scheduled_at <= Math.floor(Date.now()/1000) ? " (due)" : "";
        return `<tr>
          <td>${escape(j.title)}</td>
          <td><span class="pill s-${j.status}">${j.status}</span></td>
          <td class="muted">${ts}${due}</td>
          <td class="muted">${escape((j.last_error||"").slice(0,60))}</td>
          <td>${j.status==='done'?'—':`<a href="#" onclick="dl('${j.id}')">details</a>`}</td>
        </tr>`;
      }).join("");
      box.innerHTML = `<table><tr><th>Title</th><th>Status</th><th>Scheduled</th><th>Last error</th><th></th></tr>${rows}</table>`;
    }

    window.dl = async (id) => {
      const res = await fetch(`${API}/videos/${id}`);
      const j = await res.json();
      alert(JSON.stringify(j, null, 2));
      loadJobs();
    };

    function escape(s) { return String(s||"").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

    $("scheduleForm")?.addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = $("submitBtn"); btn.disabled = true; btn.textContent = "Scheduling…";
      $("msg").textContent = "";
      const data = new FormData($("scheduleForm"));
      try {
        const res = await fetch(`${API}/videos`, { method: "POST", body: data });
        const j = await res.json();
        if (!res.ok) throw new Error(j.error || "failed");
        $("msg").innerHTML = `<span class="pill s-done">✓ ${j.message} (id: ${j.id})</span>`;
        $("scheduleForm").reset();
        loadJobs();
      } catch (err) {
        $("msg").innerHTML = `<span class="pill s-failed">✗ ${err.message}</span>`;
      } finally {
        btn.disabled = false; btn.textContent = "Schedule upload";
      }
    });

    loadChannels();
    loadJobs();
    setInterval(loadJobs, 4000);
  </script>
</body>
</html>
